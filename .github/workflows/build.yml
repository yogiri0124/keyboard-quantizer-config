name: Build firmware

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build keyboard quantizer mini (vial)
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout this config
        uses: actions/checkout@v5
        with:
          path: config
          persist-credentials: false

      - name: Read upstream settings
        run: |
          # Comments and blank lines are not valid in $GITHUB_ENV.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' config/upstream.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Checkout upstream QMK tree
        run: |
          git init qmk
          cd qmk
          git remote add origin "$UPSTREAM_REPO"
          # Treeless: full history and tags (for `git describe`) without
          # downloading old trees. Checkout fetches the files it needs.
          git fetch --filter=tree:0 --tags origin "$UPSTREAM_BRANCH"
          git checkout --detach "$UPSTREAM_REF"
          git log --oneline -1
          git describe --tags --long

      - name: Checkout upstream submodules
        working-directory: qmk
        run: |
          git submodule update --init --recursive --depth 1 \
            lib/chibios lib/chibios-contrib lib/pico-sdk lib/printf

      - name: Overlay quantizer sources
        run: |
          cd config
          # Everything except this repo's own metadata is a QMK path.
          for path in keyboards util; do
            [ -d "$path" ] && cp -a "$path" ../qmk/
          done
          cd ../qmk
          git status --short

      - name: Apply core patches
        # Small fixes to QMK core, kept as diffs so an upstream change to the
        # same lines makes the build fail here instead of silently reverting it.
        working-directory: qmk
        run: |
          for p in ../config/patches/*.patch; do
            [ -e "$p" ] || continue
            echo "Applying $p"
            git apply --verbose "$p"
          done

      - name: Install python dependencies
        working-directory: qmk
        run: |
          QMK_PYTHON=/opt/uv/tools/qmk/bin/python3
          [ -x "$QMK_PYTHON" ] || QMK_PYTHON=$(command -v python3)
          "$QMK_PYTHON" -m pip install -r requirements.txt

      - name: Build
        working-directory: qmk
        run: |
          git config --global --add safe.directory "$(pwd)"
          # Shown by the CLI `version` command: upstream describe + this repo.
          FW_VERSION="$(git describe --tags --long)-cfg-${GITHUB_SHA::7}"
          echo "Firmware version: $FW_VERSION"
          # The qmk_cli image sets QMK_USERSPACE, which makes QMK try to copy
          # the firmware into a userspace folder that does not exist here.
          env -u QMK_USERSPACE make "${KEYBOARD}:${KEYMAP}" GIT_DESCRIBE="$FW_VERSION"
          ls -l .build/*.uf2

      - name: Check HID descriptors
        # Fails the build on a malformed report descriptor, before anything
        # reaches the device. The decoded dump also goes to the job summary.
        working-directory: qmk
        run: |
          python3 ../config/tools/test_hid_descriptors.py
          status=0
          python3 ../config/tools/hid_descriptors.py .build/*.elf --max-report-bytes 32 > hid.txt 2>&1 || status=$?
          cat hid.txt
          { echo '### HID report descriptors'; echo '```'; cat hid.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: keyboard_quantizer_mini_vial
          # .build is a hidden folder, which upload-artifact skips by default.
          path: qmk/.build/*.uf2
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload ELF (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: keyboard_quantizer_mini_vial_elf
          path: qmk/.build/*.elf
          include-hidden-files: true
          if-no-files-found: error
